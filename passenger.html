<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الراكب - تتبع الحافلات</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 20px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #007bff; padding-bottom: 10px; margin-bottom: 15px; }
        .header h2 { margin: 0; color: #333; font-size: 20px; }
        .btn-logout { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .route-card { background: #f8f9fa; border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
        .route-card:hover { background: #e2e6ea; border-color: #007bff; }
        .route-title { font-weight: bold; color: #007bff; font-size: 16px; margin-bottom: 5px; }
        .info-text { font-size: 14px; color: #555; margin: 3px 0; }
        #passengerMap { width: 100%; height: 350px; border-radius: 8px; margin-top: 15px; display: none; }
        .alert-box { background: #ff9800; color: white; padding: 10px; border-radius: 5px; margin-bottom: 15px; display: none; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🚌 بوابة الركاب الذكية</h2>
        <div>
            <span id="passengerNameDisplay" style="font-weight: bold; margin-left: 10px; color: #555;"></span>
            <button class="btn-logout" onclick="logout()">خروج</button>
        </div>
    </div>

    <div id="passengerAlertBox" class="alert-box"></div>

    <div id="routesSection">
        <h3 style="font-size: 16px; color: #333;">المسارات والحافلات المتاحة لجدولك:</h3>
        <div id="availableRoutesList">
            <p style="text-align: center; color: #777;">جاري تحميل المسارات...</p>
        </div>
    </div>

    <!-- خريطة التتبع اللحظي للراكب -->
    <div id="passengerMap"></div>
    <button id="btnBackToList" onclick="backToRoutesList()" style="display:none; width:100%; margin-top:10px; background:#6c757d; color:white; border:none; padding:10px; border-radius:5px; cursor:pointer; font-weight:bold;">⬅️ العودة لقائمة المسارات</button>
</div>

<script src="/js/passenger-core.js"></script>
</body>
</html>
